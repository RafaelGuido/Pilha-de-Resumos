# Publica a versão web (iPad / navegador) no GitHub Pages a cada push na main que mexa no app.
# Pré-requisito (uma vez só): Settings > Pages > Source: "GitHub Actions".
name: Publicar versão web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o site
        run: |
          mkdir _site
          cp -r app/. _site/
          # cache do modo offline com o nome do commit: cada publicação substitui a anterior
          sed -i "s/const CACHE = 'pilha-dev'/const CACHE = 'pilha-${GITHUB_SHA::7}'/" _site/sw.js
          grep -q "pilha-${GITHUB_SHA::7}" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
